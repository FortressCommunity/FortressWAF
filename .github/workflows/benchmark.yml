name: Performance Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release
        run: cargo build --release --locked
        working-directory: rust

      - name: Run cargo benchmarks
        run: |
          # The engine hot path is benchmarked with the built-in harness when
          # present; otherwise fall back to a release build timing.
          cargo bench --workspace 2>/dev/null || echo "no cargo benches; using tests as a smoke benchmark"

      - name: Detection parity (corpus)
        run: cargo test --workspace --test attack_corpus --locked -- --nocapture
        working-directory: rust
