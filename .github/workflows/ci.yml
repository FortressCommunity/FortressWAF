name: CI

on:
  push:
    branches: [main, fix/bugs, fix/security-critical]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: 'stable'
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check formatting
        run: cargo fmt --check
        working-directory: rust

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: rust

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release
        run: cargo build --release --locked
        working-directory: rust

      - name: Verify binaries
        run: |
          file rust/target/release/fortresswaf
          ls -lh rust/target/release/fortresswaf rust/target/release/fortressctl rust/target/release/healthcheck

  test-rust:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run tests (includes attack-corpus parity)
        run: cargo test --workspace --locked
        working-directory: rust

  test-python:
    name: Test Python ML Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd ml-engine
          pip install -r requirements.txt -q 2>/dev/null || pip install fastapi uvicorn pydantic scikit-learn torch transformers numpy pandas redis prometheus-client grpcio protobuf httpx pytest -q

      - name: Test Python imports
        run: |
          cd ml-engine
          python tests/test_imports.py

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd dashboard
          npm install --silent 2>/dev/null

      - name: TypeScript check
        run: |
          cd dashboard
          npx tsc --noEmit --project tsconfig.json
