name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binaries (linux amd64)
        run: cargo build --release --locked
        working-directory: rust

      - name: Package binaries
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for bin in fortresswaf fortressctl healthcheck; do
            cp "rust/target/release/${bin}" "dist/${bin}"
          done
          tar -czf "dist/fortresswaf-${tag}-linux-amd64.tar.gz" -C dist fortresswaf fortressctl healthcheck
          cp deploy/config.yaml dist/ || true
          cp LICENSE dist/ || true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: rust
          format: spdx-json
          output-file: dist/sbom.spdx.json
          syft-version: latest

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fortresswaf-*.tar.gz
            dist/sbom.spdx.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push proxy image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile \
            -t fortresswaf/proxy:${{ github.ref_name }} \
            --push .
