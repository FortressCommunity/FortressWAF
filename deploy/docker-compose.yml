

# Only services that something actually consumes are listed here:
#   fortresswaf -> postgres (startup connectivity check)
#   fortresswaf -> ml-engine (HTTP sidecar, see deploy/config.yaml)
#   dashboard   -> fortresswaf admin API (8443)
#
# Earlier revisions also ran redis, nats and opensearch. Nothing in the Go
# code or the Python sidecar connects to them, so they were removed rather
# than kept as containers that look like infrastructure but do nothing.

services:
  fortresswaf:
    image: fortresswaf/fortresswaf:latest
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      # The proxy listener keeps port 80 inside the network; Caddy owns the
      # public 80/443 and forwards to it. These two are bound to loopback so
      # the demo script can still reach them, without exposing the origin on
      # the internet behind Caddy's back.
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
    environment:
      - CONFIG_PATH=/etc/fortresswaf/config.yaml
      - DATABASE_URL=postgres://fortress:fortress@postgres:5432/fortresswaf?sslmode=disable
      - ML_ENGINE_URL=http://ml-engine:8000
      # Admin console credentials, expanded into config.yaml's ${...} refs.
      # Values come from deploy/.env (gitignored), so they stay out of git.
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      # The runtime config lives in a writable DIRECTORY, not a single mounted
      # file. The WAF runs as a nonroot user and rewrites the config atomically
      # (temp file + rename) when a domain is added; renaming over a single-file
      # bind mount fails with "Resource busy", so the directory is mounted and
      # the config is one file inside it. deploy.sh seeds and chowns this file.
      - ./runtime:/etc/fortresswaf
      - fortress-data:/var/lib/fortresswaf
      # Same corpus volume the sidecar reads, so collected samples are visible
      # to training immediately.
      - ml-corpus:/corpus
    # /health is served by the admin API on 8443, not the proxy listener.
    # The distroless image has no shell, so the probe is a static Go binary.
    healthcheck:
      test: ["CMD", "/healthcheck", "http://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Without this the whole public site stays down after a host reboot,
    # because only the edge services used to come back on their own.
    restart: unless-stopped
    networks:
      - fortress-net
      # Reaches the demo target by container name. Kept separate so the
      # deliberately vulnerable app cannot see postgres, ml-engine or the
      # admin API on fortress-net.
      - demo-net

  ml-engine:
    build:
      context: ../ml-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MODEL_DIR=/app/models
      # The training corpus is a shared volume: the WAF collector appends
      # high-confidence samples, the sidecar trains from them.
      - CORPUS_DIR=/corpus
    volumes:
      # Only the writable model artefacts live on a volume. Mounting the whole
      # /app/models would shadow the image's classifier.py and other source,
      # which is why the code must stay in the image layer.
      - ml-models:/app/models/persisted
      - ml-corpus:/corpus
    # The image defines its own python-based HEALTHCHECK (no wget in
    # python:3.14-slim); defining one here would shadow it and break.
    networks:
      - fortress-net

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        # Same-origin relative path: the browser calls /api/v1 on whatever host
        # served the dashboard. Caddy routes /api/* to the WAF on that same
        # host, so the dashboard and its API share one origin and one DNS name.
        NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      fortresswaf:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    # NEXT_PUBLIC_API_URL is baked in at build time (see dashboard/Dockerfile).
    restart: unless-stopped
    networks:
      - fortress-net

  # The demo target behind demo.tkjt3yapera.my.id. It is intentionally full of
  # vulnerabilities (SQLi, LFI, upload, XSS) so the WAF has something real to
  # block. Built from github.com/daffainfo/vulnerable-web; see demo-app/Dockerfile.
  vulnerable-web:
    image: fortresswaf/vulnerable-web:latest
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - demo-net

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dashboard
      - fortresswaf
    restart: unless-stopped
    networks:
      - fortress-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fortresswaf
      POSTGRES_USER: fortress
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fortress}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortress"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fortress-net

networks:
  # Explicitly named (not project-prefixed) so the monitoring stack can attach
  # to it as an external network and reach the WAF admin API.
  fortress-net:
    name: fortress-net
    driver: bridge
  # `internal: true` gives the demo target no route off the host: even with a
  # full compromise it cannot call out, and it never joins fortress-net.
  demo-net:
    name: demo-net
    driver: bridge
    internal: true

volumes:
  postgres-data:
  fortress-data:
  ml-models:
  # Shared between fortresswaf (writer) and ml-engine (reader): the live
  # training corpus.
  ml-corpus:
  caddy-data:
  caddy-config:
