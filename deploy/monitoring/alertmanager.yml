# Alertmanager config.
#
# Alertmanager does not expand ${VAR} placeholders: a literal
# "${SLACK_WEBHOOK_URL}" is an invalid URL and the container refuses to start.
# Real delivery (SMTP/Slack/PagerDuty) needs credentials that a demo machine
# does not have, so the receivers below point at a local sink that is always
# reachable by configuration validation. Alerts still show up in the
# Alertmanager UI at http://localhost:9093, which is what a demo can actually
# show. Replace the webhook URL with a real one to deliver alerts.

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 0s
    - match:
        severity: high
      receiver: 'high-receiver'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://127.0.0.1:5001/alerts'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://127.0.0.1:5001/critical'
        send_resolved: true

  - name: 'high-receiver'
    webhook_configs:
        - url: 'http://127.0.0.1:5001/high'
          send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
