global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'fortresswaf-proxy'
    static_configs:
      - targets: ['fortresswaf:8443']
    metrics_path: /metrics
    scheme: http

  - job_name: 'fortresswaf-ml'
    static_configs:
      - targets: ['ml-engine:8000']
    metrics_path: /metrics
    scheme: http

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # No node-exporter service is shipped, so it is not scraped. Add the service
  # to docker-compose.monitoring.yml before re-enabling this job.
