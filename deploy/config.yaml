# FortressWAF deployment configuration
# ---------------------------------------------------------------------------
# Every key in this file maps to a field the Go binary actually reads
# (see internal/config/config.go). The YAML decoder silently ignores unknown
# keys, so anything not matching the schema is dead text. This file therefore
# only contains settings that really take effect.
#
# Deliberately absent, and why:
#   * server.*           - there is no "server" config section. The reverse
#                          proxy port comes from the -proxy-port flag (default
#                          80) and the admin API port from -admin-port
#                          (default 8443). docker-compose publishes both.
#   * rate_limit / session / reputation / geo / rules_cfg
#                        - the config structs exist and parse, but no live
#                          code path consumes them (the packages behind them
#                          are not wired into the proxy). Omitted rather than
#                          imply working features.
#   * response_inspect   - scans the upstream response body for leaked
#                          secrets (private keys, cloud keys, JWTs, DB DSNs,
#                          password hashes, stack traces). Logs and counts
#                          hits by default; set block: true to abort a leaking
#                          response with 502. Only the first 1 MiB is scanned.
#   * cache / alerting / compliance / http3 / plugins / traffic / dry_run /
#     secrets / monitoring / rate_limiting / database
#                        - no matching config struct at all; they were
#                          fictional in earlier revisions of this file.
#   * rules: as a glob of rule files
#                        - rules are not loaded from disk. Detection comes
#                          entirely from the built-in inspectors enabled
#                          below. (The bundled rules/ directory is unused.)
#
# ${VAR} references are expanded from the environment at load time.

# --- Admin API + dashboard login -------------------------------------------
admin:
  enabled: true
  port: 8443
  # Dashboard credentials. The login form accepts either value as the email OR
  # the password (compared in constant time). The real values live in .env,
  # which is gitignored, so they never land in the repository.
  api_keys:
    - ${ADMIN_EMAIL}
    - ${ADMIN_PASSWORD}
  # Origins allowed to call this admin API from a browser. The dashboard is
  # served on port 3000; without an entry here its requests are blocked by
  # the browser's same-origin policy. Add the host/port you present from.
  cors_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
    # The dashboard is served over Caddy at this host; the browser blocks the
    # admin API calls without it.
    - https://fort.tkjt3yapera.my.id
  # Only these peers may set X-Forwarded-For. FortressWAF treats a peer outside
  # this list as the client, because per-IP rate limits, brute-force lockouts
  # and bot scoring all key off the address and a spoofed header would bypass
  # them. Caddy sits in front on the fortress-net bridge; drop this entry and
  # every client collapses into the single Caddy container address.
  trusted_proxies:
    - 172.18.0.0/16

# --- Protected site ---------------------------------------------------------
sites:
  # FindSiteByDomain matches the Host header exactly, and the handler falls
  # back to the first site when nothing matches, so a single entry covers a
  # local demo regardless of the hostname used.
  - name: default
    domains:
      - localhost
      # Public demo host: Caddy forwards it here on purpose so the WAF
      # inspects it and the dashboard has live blocked traffic to show.
      - demo.tkjt3yapera.my.id
    # The demo backend: github.com/daffainfo/vulnerable-web, a deliberately
    # vulnerable PHP app (SQLi, LFI, XSS, upload). It lives on demo-net, which
    # is internal, so a compromised lab cannot reach anything else. Benign
    # requests get a real page; attacks are blocked at the WAF, and a bypass
    # would land somewhere harmless.
    upstream: http://vulnerable-web:80
    # The lab app's admin panel lives under /administrator, which the
    # sensitive-path rule (API002) blocks by default. This host exists to
    # expose those labs, so that one prefix is forwarded uninspected. Keep it
    # to the minimum: everything here is unprotected, and /metrics counts it.
    exclude_paths:
      - /administrator
    waf_enabled: true

# --- Detection engine -------------------------------------------------------
# Each module below is a built-in inspector. All of these are real
# implementations (verified) and are what the WAF actually blocks with.

sqli:  { enabled: true }
xss:   { enabled: true }
rce:   { enabled: true }
ddos:  { enabled: true }
protocol: { enabled: true }
bot:   { enabled: true }
api_protect: { enabled: true }
upload: { enabled: true }
ja3:   { enabled: true }      # only fires on TLS traffic
desync: { enabled: true }     # HTTP request smuggling (CL.TE / TE.CL)
parser_hardening: { enabled: true }

credential:
  enabled: true
  max_attempts: 5
  window_sec: 300
  block_duration_sec: 900
  login_paths:
    - /api/v1/login
    - /login

# Disabled below, with reasons:

# adaptive issues interactive JS/CAPTCHA challenges; it needs a real browser
# flow and would stall a curl-driven demo. Enable to demo it.
adaptive:
  enabled: false
  js_script_path: ""
  tarpit_delay_ms: 1500
  captcha_score: 0.8
  challenge_ttl: 300

# behavioural scoring can block benign bursts (e.g. clicking through the demo
# quickly). Tune threshold/max_requests up before enabling.
behavioral:
  enabled: false
  reputation: false     # toggle the reputation signal
  velocity: false       # toggle the request-velocity signal
  path_entropy: false   # toggle the path-entropy signal
  threshold: 0.85
  window_sec: 60
  max_requests: 100

# Registered but currently a no-op stub; see header comment.
response_inspect:
  enabled: true
  inspect_body: true
  # Monitor by default: a leak is logged and counted, not blocked. Response
  # inspection scans content, so a match in legitimate documentation or a code
  # sample must not take a page down. Set block: true to turn hits into a 502.
  block: false

# eBPF telemetry needs CAP_BPF and a host NIC, unavailable in the container.
ebpf:
  enabled: false
  interface: ""
  port: 0
  sample_rate: 0

# No WebAssembly modules are bundled with the release.
wasm:
  enabled: false
  module_dir: ""
  max_memory_pages: 0
  modules: []

# The remaining inspectors need external services to be meaningful; they are
# inert without them.
jwt:      { enabled: false }
oauth:    { enabled: false }
mtls:     { enabled: false }
captcha:  { enabled: false }
graphql:  { enabled: false }   # no GraphQL backend in the demo stack
websocket: { enabled: false }
soap:     { enabled: false }
grpc:     { enabled: false }

# --- Performance isolation --------------------------------------------------
performance:
  enabled: true
  max_regex_ms: 1000
  max_wasm_ms: 5000
  max_memory_mb: 512
  max_concurrency: 0       # 0 = unlimited
  circuit_threshold: 0

shadow_mode: { enabled: false }   # log-only mode, never blocks
learning_mode: { enabled: false }

# --- Logging ----------------------------------------------------------------
logging:
  level: info               # debug with the -dev flag instead
  format: json
  output: stdout

# --- TLS --------------------------------------------------------------------
# Off: the demo stack serves plain HTTP on port 80. The admin API and the
# proxy both listen in cleartext, which is why the compose healthcheck uses
# http://. Turn this on and provide cert_file/key_file for TLS demos.
tls:
  enabled: false
  cert_file: ""
  key_file: ""
  min_version: "1.2"
  http2_enabled: false
  ocsp_enabled: false
  acme_enabled: false
  acme_email: ""
  acme_domains: []
  acme_cache_dir: ""

# --- Database ---------------------------------------------------------------
# The proxy opens this connection on startup (github.com/lib/pq driver).
# ${DATABASE_URL} is set by docker-compose.
db:
  driver: postgres
  dsn: ${DATABASE_URL}
  max_open: 25
  max_idle: 5

# --- Metrics ----------------------------------------------------------------
# Served at <path> on <port> by a dedicated listener, in addition to the
# admin API's /metrics on 8443. docker-compose does not publish this port;
# Prometheus scrapes the admin API instead.
prometheus:
  enabled: true
  path: /metrics
  port: 9090

# --- ML sidecar -------------------------------------------------------------
# Honest status: the config field is read (and validated), but the proxy does
# not yet send requests to the ML engine - detection is rule-based. Wiring is
# tracked as follow-up work; do not assume traffic is ML-inspected today.
ml:
  enabled: false
  endpoint: ${ML_ENGINE_URL}
  timeout_sec: 5
  max_retries: 2
  fallback_mode: allow
  min_score: 0.5
  model_name: payload-classifier

# --- SIEM export ------------------------------------------------------------
siem:
  enabled: false
  export_interval: 10s
  batch_size: 100
  exporters: []

# --- Server identity + live training corpus ---------------------------------
# expected_ips: a domain added through the console must resolve to one of these
# addresses before it is protected. Set this to the public IP of this server so
# DNS ownership is actually verified (looked up by the WAF itself, never
# trusted from the client). Empty means "only require that the domain resolves".
server:
  expected_ips:
    - 103.253.147.149
    - 2400:6180:0:d2:0:3:2f88:4000

# training.corpus_dir is the shared volume the ML sidecar also reads. When
# enabled, the WAF appends only high-confidence attack payloads (named attack
# families, score >= 70), labelled by rule, to the corpus; the sidecar retrains
# from it and refuses to keep a model that scores worse than the incumbent.
training:
  enabled: true
  corpus_dir: /corpus
