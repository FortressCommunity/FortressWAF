[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/services",
    "crates/proxy",
    "crates/ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/FortressWAF/FortressWAF"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
once_cell = "1"
tracing = "0.1"
parking_lot = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
hmac = "0.12"
rsa = "0.9"
ecdsa = "0.16"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13"
signature = "2"
ureq = "2"
getrandom = "0.2"
md-5 = "0.10"
x509-parser = "0.18"
humantime = "2"
